<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: 'Segoe UI', Inter, sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; }
      .sub-title { font-family: 'Segoe UI', Inter, sans-serif; font-size: 12px; font-weight: 500; fill: #64748b; }
      .node-num { font-family: 'Segoe UI', Inter, sans-serif; font-size: 11px; font-weight: 800; fill: #ffffff; }
      .node-title { font-family: 'Segoe UI', Inter, sans-serif; font-size: 13px; font-weight: 700; fill: #0f172a; }
      .node-tech { font-family: 'Segoe UI', Inter, sans-serif; font-size: 10px; font-weight: 700; fill: #2563eb; }
      .node-desc { font-family: 'Segoe UI', Inter, sans-serif; font-size: 10px; fill: #475569; }
      .link-label { font-family: 'Segoe UI', Inter, sans-serif; font-size: 9px; font-weight: 700; fill: #64748b; }
    </style>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-hitl" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-err" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="520" fill="#f8fafc" rx="12"/>

  <!-- Header -->
  <rect x="25" y="20" width="1050" height="60" rx="10" fill="#ffffff" filter="url(#card-shadow)"/>
  <rect x="25" y="20" width="6" height="60" rx="3" fill="#2563eb"/>
  <text x="45" y="45" class="main-title">Ecosistema Autónomo de Cotizaciones Industriales con HITL</text>
  <text x="45" y="65" class="sub-title">Empresa Sanmartín S.A. | Flujo de 4 Tecnologías: n8n + Airtable + OpenAI + Gmail/Slack</text>

  <!-- NODO 1: WEBHOOK -->
  <g transform="translate(35, 120)">
    <rect width="130" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <circle cx="20" cy="22" r="10" fill="#2563eb"/>
    <text x="20" y="26" class="node-num" text-anchor="middle">1</text>
    <text x="36" y="26" class="node-title">Webhook</text>
    <text x="12" y="48" class="node-tech">TRIGGER INBOUND</text>
    <text x="12" y="70" class="node-desc">• Recibe pedido</text>
    <text x="12" y="86" class="node-desc">• Cliente + Equipo</text>
    <text x="12" y="102" class="node-desc">• Texto en lenguaje nat.</text>
  </g>

  <!-- NODO 2: VALIDACIÓN -->
  <g transform="translate(205, 120)">
    <rect width="140" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <circle cx="20" cy="22" r="10" fill="#0284c7"/>
    <text x="20" y="26" class="node-num" text-anchor="middle">2</text>
    <text x="36" y="26" class="node-title">Validación</text>
    <text x="12" y="48" class="node-tech" fill="#0284c7">FILTRO DE ENTRADA</text>
    <text x="12" y="70" class="node-desc">• ¿Email con @?</text>
    <text x="12" y="86" class="node-desc">• ¿Mensaje no vacío?</text>
    <text x="12" y="102" class="node-desc">• Separa ruta error</text>
  </g>

  <!-- RUTA ERROR -->
  <g transform="translate(205, 290)">
    <rect width="140" height="90" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="12" y="25" class="node-title" fill="#9f1239">Ruta de Error</text>
    <text x="12" y="42" class="node-tech" fill="#be123c">LOGS AIRTABLE</text>
    <text x="12" y="62" class="node-desc">• Guarda falla en DB</text>
    <text x="12" y="78" class="node-desc">• Evita bucle y detiene</text>
  </g>

  <!-- NODO 3: AIRTABLE MEMORIA -->
  <g transform="translate(385, 120)">
    <rect width="145" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <circle cx="20" cy="22" r="10" fill="#f59e0b"/>
    <text x="20" y="26" class="node-num" text-anchor="middle">3</text>
    <text x="36" y="26" class="node-title">Airtable DB</text>
    <text x="12" y="48" class="node-tech" fill="#d97706">EL CEREBRO (CATÁLOGO)</text>
    <text x="12" y="70" class="node-desc">• Consulta precios base</text>
    <text x="12" y="86" class="node-desc">• Repuestos de lavadora</text>
    <text x="12" y="102" class="node-desc">• Memoria relacional</text>
  </g>

  <!-- NODO 4: OLLAMA IA LOCAL -->
  <g transform="translate(570, 120)">
    <rect width="150" height="120" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="2" filter="url(#card-shadow)"/>
    <circle cx="20" cy="22" r="10" fill="#6366f1"/>
    <text x="20" y="26" class="node-num" text-anchor="middle">4</text>
    <text x="36" y="26" class="node-title">Ollama IA</text>
    <text x="12" y="48" class="node-tech" fill="#4f46e5">QWEN2.5:7B (LOCAL)</text>
    <text x="12" y="70" class="node-desc">• Tasación en JSON Mode</text>
    <text x="12" y="86" class="node-desc">• 100% Privado y Costo $0</text>
    <text x="12" y="102" class="node-desc">• Score y monto en USD</text>
  </g>

  <!-- NODO 5: BIFURCACIÓN HITL -->
  <g transform="translate(760, 120)">
    <rect width="145" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <circle cx="20" cy="22" r="10" fill="#8b5cf6"/>
    <text x="20" y="26" class="node-num" text-anchor="middle">5</text>
    <text x="36" y="26" class="node-title">Control HITL</text>
    <text x="12" y="48" class="node-tech" fill="#7c3aed">BIFURCACIÓN DE RIESGO</text>
    <text x="12" y="70" class="node-desc">• ¿Monto > $3,000 USD?</text>
    <text x="12" y="86" class="node-desc">• Si es menor: Auto-aprob.</text>
    <text x="12" y="102" class="node-desc">• Si es mayor: Pide permiso</text>
  </g>

  <!-- HITL PAUSE BOX -->
  <g transform="translate(760, 280)">
    <rect width="145" height="100" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="12" y="25" class="node-title" fill="#92400e">Pausa Humana</text>
    <text x="12" y="42" class="node-tech" fill="#b45309">WAIT NODE (HITL)</text>
    <text x="12" y="62" class="node-desc">• Suspende el flujo</text>
    <text x="12" y="78" class="node-desc">• Espera aprobación</text>
    <text x="12" y="94" class="node-desc">• Evita error metralleta</text>
  </g>

  <!-- NODO 6: AIRTABLE GUARDAR Y GMAIL SALIDA -->
  <g transform="translate(945, 120)">
    <rect width="130" height="120" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#card-shadow)"/>
    <circle cx="20" cy="22" r="10" fill="#10b981"/>
    <text x="20" y="26" class="node-num" text-anchor="middle">6</text>
    <text x="36" y="26" class="node-title">Entrega Final</text>
    <text x="12" y="48" class="node-tech" fill="#059669">LA VOZ (MULTICANAL)</text>
    <text x="12" y="70" class="node-desc">• Guarda en Airtable</text>
    <text x="12" y="86" class="node-desc">• Envía cotización Gmail</text>
    <text x="12" y="102" class="node-desc">• Estado: Completado</text>
  </g>

  <!-- Connectors -->
  <line x1="165" y1="180" x2="205" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="345" y1="180" x2="385" y2="180" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="275" y1="240" x2="275" y2="290" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow-err)"/>
  <line x1="530" y1="180" x2="570" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="720" y1="180" x2="760" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)"/>
  <line x1="905" y1="180" x2="945" y2="180" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="832" y1="240" x2="832" y2="280" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-hitl)"/>
  <path d="M 905 330 L 1010 330 L 1010 240" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Footer text -->
  <text x="45" y="495" class="sub-title">Arquitectura resumida y limpia | 4 Tecnologías: n8n, Airtable, OpenAI y Gmail/Slack | Aprobación HITL garantizada</text>
</svg>